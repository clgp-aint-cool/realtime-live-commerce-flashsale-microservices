server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Cấu hình runtime: không cache để đổi biến môi trường là có hiệu lực ngay.
  location = /config.js {
    add_header Cache-Control "no-store";
  }

  # File build của Vite có hash trong tên: cache lâu.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
